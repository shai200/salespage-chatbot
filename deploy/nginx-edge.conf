server {
    listen 80;
    server_name _;
    proxy_connect_timeout 5s;

    # Staging trees are not public, even though they live on the sites volume.
    location ^~ /.staging/ {
        return 404;
    }

    location = /.staging {
        return 404;
    }

    location /api/ {
        proxy_pass http://studio:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location = /api {
        proxy_pass http://studio:8080/api;
        proxy_set_header Host $host;
    }

    location = /health {
        proxy_pass http://studio:8080/health;
        proxy_set_header Host $host;
    }

    location /assets/ {
        proxy_pass http://studio:8080;
        proxy_set_header Host $host;
    }

    location = /assets {
        proxy_pass http://studio:8080/assets;
        proxy_set_header Host $host;
    }

    location /static/ {
        proxy_pass http://studio:8080;
        proxy_set_header Host $host;
    }

    location = /static {
        proxy_pass http://studio:8080/static;
        proxy_set_header Host $host;
    }

    location = / {
        proxy_pass http://studio:8080/;
        proxy_set_header Host $host;
    }

    location / {
        root /app/persist/sites;
        try_files $uri $uri/ $uri/index.html =404;
    }
}
