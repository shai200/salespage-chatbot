services:
  studio:
    build: .
    environment:
      STUDIO_HOST: "0.0.0.0"
      STUDIO_PORT: "8080"
      PUBLISH_MODE: static
      PUBLIC_BASE_URL: http://localhost:8081
      STUDIO_FAKE_LLM: ${STUDIO_FAKE_LLM:-1}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      - sites:/app/sites
      - data:/app/data
    expose:
      - "8080"

  edge:
    image: nginx:1.27-alpine
    ports:
      - "8081:80"
    volumes:
      - sites:/sites:ro
      - ./deploy/nginx-edge.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - studio

volumes:
  sites:
  data:
