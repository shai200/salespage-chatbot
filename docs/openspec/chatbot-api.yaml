openapi: 3.1.0
info:
  title: Sales Page Chatbot API
  version: 1.0.0
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Service is healthy
  /api/chat:
    post:
      summary: Generate a chatbot reply
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
      responses:
        '200':
          description: Chatbot reply
          content:
            application/json:
              schema:
                type: object
                required:
                  - reply
                properties:
                  reply:
                    type: string
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: string
