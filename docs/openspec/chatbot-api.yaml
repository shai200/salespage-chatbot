openapi: 3.1.0
info:
  title: Sales Page Chatbot API
  version: 1.0.0
servers:
  - url: http://localhost:3000
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
              example:
                status: ok
  /api/chat:
    post:
      summary: Generate a chatbot reply
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
      responses:
        '200':
          description: Chatbot reply
          content:
            application/json:
              schema:
                type: object
                required:
                  - reply
                properties:
                  reply:
                    type: string
        '400':
          description: Invalid request payload or missing required message
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: string
              examples:
                invalidJson:
                  summary: Malformed JSON
                  value:
                    error: Invalid JSON payload
                missingMessage:
                  summary: Missing message field
                  value:
                    error: The "message" field is required.
        '413':
          description: Request body exceeds the supported size limit
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: string
              example:
                error: Request body too large
